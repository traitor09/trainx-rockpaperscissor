<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="container">

        <h1>Rock Paper Scissors</h1>

    </div>

    <script src="game.js"></script>

</body>
</html>
